<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warsaw Tactical - Digital Twin</title>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        body,
        html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #010205;
        }

        #cesiumContainer {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #22d3ee;
            font-family: monospace;
            font-size: 14px;
            z-index: 90;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        }

        .cesium-viewer-bottom {
            display: none !important;
        }
    </style>
    <script src="/cesium/Cesium.js"></script>
</head>

<body>
    <div id="loading">Synchronizacja Siatki Taktycznej...</div>
    <div id="cesiumContainer"></div>

    <script>
        window.CESIUM_BASE_URL = '/cesium';
        const ION_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwNjBhYjA0Ni03MjAzLTQyZmYtODRlNy04NmEzNWYzMWY1NDAiLCJpZCI6Mzc4OTMyLCJpYXQiOjE3Njg0NjY4NzZ9.2SOHQ4b9RBBlP_Gt4DNAD7PFOp9PD2TW2ahFcvAxnSQ';
        Cesium.Ion.defaultAccessToken = ION_TOKEN;

        const viewer = new Cesium.Viewer('cesiumContainer', {
            animation: false,
            timeline: false,
            baseLayerPicker: false,
            homeButton: false,
            geocoder: false,
            selectionIndicator: false,
            infoBox: false,
            navigationHelpButton: false,
            sceneModePicker: false,
            creditContainer: document.createElement("div")
        });

        // SKYBOX STARS
        viewer.scene.skyBox = new Cesium.SkyBox({
            show: true,
            sources: {
                positiveX: '/cesium/Assets/Textures/SkyBox/tycho2t3_80_px.jpg',
                negativeX: '/cesium/Assets/Textures/SkyBox/tycho2t3_80_mx.jpg',
                positiveY: '/cesium/Assets/Textures/SkyBox/tycho2t3_80_py.jpg',
                negativeY: '/cesium/Assets/Textures/SkyBox/tycho2t3_80_my.jpg',
                positiveZ: '/cesium/Assets/Textures/SkyBox/tycho2t3_80_pz.jpg',
                negativeZ: '/cesium/Assets/Textures/SkyBox/tycho2t3_80_mz.jpg'
            }
        });

        // TACTICAL SHADER - MATCHING SCREEN 1 COLORS
        const tacticalShader = `
            uniform sampler2D colorTexture;
            in vec2 v_textureCoordinates;
            void main() {
                vec4 color = texture(colorTexture, v_textureCoordinates);
                
                // 1. Grayscale base
                float gray = dot(color.rgb, vec3(0.299, 0.587, 0.114));
                
                // 2. Copper/Beige Building Color (Match Screen 1)
                vec3 copper = vec3(0.78, 0.65, 0.50); 
                vec3 darkBase = vec3(0.01, 0.02, 0.04); 
                
                // 3. Apply color grading
                vec3 baseColor = mix(darkBase, copper, pow(gray, 1.3));
                
                // 4. Edge Highlighting (Cyan Outlines)
                // We use a sharpen-like effect for edge detection on textures
                float edge = step(0.55, gray) * step(gray, 0.62);
                vec3 cyan = vec3(0.13, 0.82, 0.93);
                
                vec3 finalColor = mix(baseColor, cyan, edge * 0.4);
                
                // 5. Global Tactical Tint
                finalColor *= vec3(0.9, 0.95, 1.0);

                out_FragColor = vec4(finalColor, 1.0);
            }
        `;

        viewer.scene.postProcessStages.add(new Cesium.PostProcessStage({
            fragmentShader: tacticalShader
        }));

        async function init() {
            try {
                const tileset = await Cesium.createGooglePhotorealistic3DTileset();

                // PERFORMANCE OPTIMIZATION: "Cut out" just the city by limiting detail and memory
                tileset.maximumScreenSpaceError = 24; // Increases performance by processing less details (default ~16)
                tileset.maximumMemoryUsage = 1024; // Limits memory usage
                tileset.preloadWhenHidden = false; // Don't load what we don't see
                tileset.dynamicScreenSpaceError = true; // Auto-adjust quality based on movement

                // OPTIMIZATION: Cull requests during camera movement to prevent stutter
                tileset.cullRequestsWhileMoving = true;
                tileset.cullRequestsWhileMovingMultiplier = 60.0;
                tileset.dynamicScreenSpaceError = true;
                tileset.dynamicScreenSpaceErrorDensity = 0.00278;
                tileset.dynamicScreenSpaceErrorFactor = 4.0;

                viewer.scene.primitives.add(tileset);

                // Optimization: Lower resolution slightly for high-DPI screens to prevent lag
                viewer.resolutionScale = window.devicePixelRatio > 1 ? 0.9 : 1.0;
                viewer.scene.requestRenderMode = true; // Only render when needed
                viewer.scene.maximumRenderTimeChange = Infinity; // Smooth out frames

                // Wide angle view matching Screen 1
                viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(21.0122, 52.20, 4500),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(-25),
                        roll: 0.0
                    }
                });

                document.getElementById('loading').style.display = 'none';

                // =================================================================================
                // TRYB WYSPY (ISLAND MODE): Wycinamy Warszawę używając Clipping Planes
                // =================================================================================

                // 1. Definiujemy środek "wyspy" (Centrum Warszawy)
                const position = Cesium.Cartesian3.fromDegrees(21.0122, 52.2297, 0); // PKiN

                // 2. Tworzymy lokalny układ współrzędnych dla płaszczyzn tnących (East-North-Up)
                // Używamy distance > 0 (odległość od środka) i normalnych celujących "na zewnątrz" (żeby uciąć to co dalej)
                // Aby ZACHOWAĆ środek (box [-distance, distance]), musimy uciąć:
                // x > distance (Normal: -1, 0, 0)
                // x < -distance (Normal: 1, 0, 0)
                // y > distance (Normal: 0, -1, 0)
                // y < -distance (Normal: 0, 1, 0)

                const distance = 4500; // Promień wyspy w metrach (4.5km)

                const clippingPlanes = new Cesium.ClippingPlaneCollection({
                    modelMatrix: Cesium.Transforms.eastNorthUpToFixedFrame(position),
                    planes: [
                        new Cesium.ClippingPlane(new Cesium.Cartesian3(-1.0, 0.0, 0.0), distance), // Clip Est (x > 4500)
                        new Cesium.ClippingPlane(new Cesium.Cartesian3(1.0, 0.0, 0.0), distance),  // Clip West (x < -4500)
                        new Cesium.ClippingPlane(new Cesium.Cartesian3(0.0, -1.0, 0.0), distance), // Clip North (y > 4500)
                        new Cesium.ClippingPlane(new Cesium.Cartesian3(0.0, 1.0, 0.0), distance)   // Clip South (y < -4500)
                    ],
                    edgeWidth: 2.0,
                    edgeColor: Cesium.Color.CYAN.withAlpha(0.5),
                    unionClippingRegions: true // Clip if OUTSIDE (satisfies any of the clip inequalities)
                });

                tileset.clippingPlanes = clippingPlanes;

                // 3. Pełne sterowanie kamerą (zgodnie z życzeniem)
                // Ale ustawiamy ograniczenia "podłogi", żeby nie wchodzić pod ziemię
                viewer.scene.screenSpaceCameraController.enableCollisionDetection = true;
                viewer.scene.screenSpaceCameraController.minimumZoomDistance = 100;
                viewer.scene.screenSpaceCameraController.maximumZoomDistance = 30000; // Trochę swobody, ale bez przesady
                viewer.scene.screenSpaceCameraController.enableTilt = true;
                viewer.scene.screenSpaceCameraController.enableLook = true;

                // WYŁĄCZAMY glob/atmosferę, żeby było widać tylko miasto i czarne tło
                viewer.scene.globe.show = false; // Ukrywa kulę ziemską (jeśli coś wystawało)
                viewer.scene.skyAtmosphere.show = false; // Ukrywa niebieską atmosferę

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = 'BŁĄD SIATKI DANYCH';
            }
        }

        init();
    </script>
</body>

</html>
